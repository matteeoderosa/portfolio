<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Pagina non trovata · Page not found · Matteo De Rosa</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #e9ecee;
    --surface: #d8dde1;
    --ink: #141a20;
    --muted: #4d5963;
    --accent: #1f3a52;
    --accent-ink: #eef3f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111a24;
      --surface: #1a2635;
      --ink: #e6ebf0;
      --muted: #9fb0c0;
      --accent: #8fb8de;
      --accent-ink: #0e1620;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    align-items: center;
    padding: clamp(16px, 2.2vw, 32px);
    background: var(--bg);
    color: var(--ink);
    font-family: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 1.125rem;
    line-height: 1.6;
  }
  main {
    width: 100%;
    max-width: 980px;
    display: grid;
    gap: 64px clamp(32px, 6vw, 96px);
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  }
  h1 {
    margin: 0 0 16px;
    font-family: "Bodoni Moda", Didot, "Bodoni 72", Georgia, "Times New Roman", serif;
    font-weight: 500;
    font-size: clamp(2rem, 1rem + 3vw, 3.25rem);
    letter-spacing: -0.02em;
    line-height: 1.05;
  }
  p { margin: 0 0 24px; max-width: 34ch; }
  .code { margin: 0 0 24px; color: var(--muted); font-size: 0.9375rem; }
  a {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 10px 24px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 0.9375rem;
    font-weight: 500;
    text-decoration: none;
  }
  a:hover { text-decoration: underline; text-underline-offset: 0.25em; }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <section lang="it">
    <p class="code">404</p>
    <h1>Pagina non trovata</h1>
    <p>La pagina che cerchi non esiste o è stata spostata.</p>
    <a href="/">Torna alla home</a>
  </section>
  <section lang="en">
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist or has been moved.</p>
    <a href="/en/">Back to the home page</a>
  </section>
</main>
</body>
</html>
